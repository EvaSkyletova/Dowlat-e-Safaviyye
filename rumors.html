<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вести и Слухи • Dowlаt-e Safaviyye</title>
<style>
:root {
    --gold-dark: #8c6a08;
    --gold: #d4af37;
    --gold-light: #fbe8a6;
    --gold-soft: #c5a059;
    --text: #f0ebd8;
    --muted: #a69e88;
    --line: rgba(212, 175, 55, 0.3);
    --line-strong: rgba(212, 175, 55, 0.65);
    --bg: #161618;
    --panel: rgba(22, 22, 25, 0.95);
    --panel-card: rgba(26, 26, 30, 0.9);
    --panel-dark: rgba(14, 14, 16, 0.95);
}

*, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-family: Georgia, "Times New Roman", serif !important;
}

/* Единый скроллбар всей страницы */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background: var(--bg) !important;
    color: var(--text);
    background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.07) 0%, transparent 60%),
        linear-gradient(to bottom, #161618, #0f0f11);
}

* {
    scrollbar-width: thin;
    scrollbar-color: var(--gold-dark) transparent;
}
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: var(--bg);
}
::-webkit-scrollbar-thumb {
    background: var(--gold-dark);
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background: var(--gold);
}

/* ШАПКА САЙТА (ЕДИНАЯ ДЛЯ ВСЕХ СТРАНИЦ) */
.site-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 20px;
    border-bottom: 2px solid var(--line);
    background: rgba(18, 18, 20, 0.96);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7);
}

.site-logo {
    font-size: 20px;
    color: var(--gold-light);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
    margin-bottom: 12px;
    font-weight: bold;
}

.site-nav {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    align-items: center;
}

.site-nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    padding: 4px 0;
    position: relative;
    font-weight: 500;
}

.site-nav a::after {
    content: '';
    position: absolute;
    width: 0;
    height: 1px;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    background-color: var(--gold);
    transition: width 0.3s ease;
}

.site-nav a:hover::after, .site-nav a.active::after {
    width: 100%;
}

.site-nav a:hover, .site-nav a.active {
    color: var(--gold-light);
    text-shadow: 0 0 10px rgba(251, 232, 166, 0.4);
}

/* ОСНОВНОЙ КОНТЕЙНЕР */
.chronicles-wrap {
    max-width: 1120px;
    margin: 40px auto;
    padding: 40px;
    background: linear-gradient(145deg, rgba(22, 22, 25, 0.95), rgba(14, 14, 16, 0.98));
    border: 1px solid var(--line);
    border-top: 2px solid var(--gold);
    border-bottom: 2px solid var(--gold);
    border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), inset 0 0 30px rgba(212, 175, 55, 0.03);
}

/* ==================== ПАРАДНЫЙ ЗАГОЛОВОК ==================== */
.chronicles-hero {
    position: relative;
    overflow: hidden;
    margin-bottom: 30px;
    padding: 25px 20px;
    border: 1px solid var(--line);
    border-top: 2px solid var(--gold);
    border-bottom: 2px solid var(--gold);
    border-radius: 6px;
    background: rgba(18, 18, 20, 0.9);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    text-align: center;
}

.chronicles-hero:after {
    content: "✦  ✧  ✦";
    position: absolute;
    right: 20px;
    bottom: 12px;
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 6px;
    opacity: 0.8;
}

.chronicles-kicker {
    margin: 0 0 6px;
    color: var(--gold-soft);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: bold;
}

.chronicles-hero h1 {
    margin: 0 0 8px;
    color: var(--gold-light);
    font-size: 26px;
    font-weight: normal;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
}

.chronicles-hero p {
    max-width: 650px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    font-style: italic;
    letter-spacing: 0.5px;
}

/* ==================== ВКЛАДКИ РЕЖИМА ==================== */
.chronicles-tabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
}

.chronicles-tab {
    padding: 11px 32px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--panel-dark);
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

.chronicles-tab:hover {
    color: var(--gold-light);
    border-color: var(--gold);
    background: rgba(212, 175, 55, 0.12);
    transform: translateY(-2px);
}

.chronicles-tab.active {
    color: #121008;
    border-color: var(--gold-light);
    background: linear-gradient(90deg, #b89947, #d4af37, #b89947);
    box-shadow: 0 0 18px rgba(212, 175, 55, 0.4);
    font-weight: bold;
}

/* ==================== ДВУХКОЛОНОЧНЫЙ БЛОК ==================== */
.chronicles-panel {
    display: none;
    grid-template-columns: 320px 1fr;
    gap: 22px;
    align-items: start; /* выравнивание по верху, убираем фиксацию */
}

.chronicles-panel.active {
    display: grid;
}

/* ЛЕВАЯ КОЛОНКА (без внутренней прокрутки) */
.timeline-nav {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    background: var(--panel-dark);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

.timeline-btn {
    width: 100%;
    text-align: left;
    padding: 13px 15px;
    border: 1px solid transparent;
    border-left: 3px solid rgba(212, 175, 55, 0.3);
    border-radius: 0 4px 4px 0;
    background: rgba(255, 255, 255, 0.02);
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-family: inherit;
}

.timeline-btn:hover {
    background: rgba(212, 175, 55, 0.1);
    border-left-color: var(--gold);
    transform: translateX(3px);
}

.timeline-btn.active {
    background: linear-gradient(90deg, rgba(212, 175, 55, 0.2), transparent);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold-light);
    box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.1);
}

.tb-date {
    font-size: 11px;
    color: var(--gold-soft);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: bold;
}

.tb-title {
    font-size: 14.5px;
    color: #e5ded0;
    line-height: 1.35;
}

.timeline-btn.active .tb-title {
    color: var(--gold-light);
    font-weight: bold;
}

/* ПРАВАЯ КОЛОНКА (ОКНО ЧТЕНИЯ — полностью без внутреннего скролла) */
.reader-frame {
    position: relative;
    padding: 30px;
    background: var(--panel-card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: 0 6px 6px 0;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
    animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.reader-header {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
}

.reader-badge-date {
    display: inline-block;
    padding: 3px 10px;
    background: rgba(212, 175, 55, 0.12);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--gold-soft);
    font-size: 11.5px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: bold;
}

.reader-title {
    margin: 0;
    color: var(--gold-light);
    font-size: 24px;
    font-weight: normal;
    line-height: 1.3;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}

.reader-content {
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--text);
}

.reader-content p {
    margin: 0 0 16px 0;
}

.reader-content p:last-child {
    margin-bottom: 0;
}

/* Игровые последствия */
.mechanics-box {
    margin-top: 25px;
    padding: 18px 20px;
    background: rgba(14, 14, 16, 0.85);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    border-radius: 0 6px 6px 0;
    box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.5);
}

.mechanics-title {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--gold-light);
    font-size: 11.5px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.mechanics-title::before {
    content: "◈";
    font-size: 13px;
    color: var(--gold);
}

.mechanics-box p {
    margin: 0 0 10px 0;
    font-size: 13.5px;
    line-height: 1.7;
    color: #dfd7c5;
}

.mechanics-box p:last-child {
    margin-bottom: 0;
}

/* Печать внизу */
.seal-highlight {
    margin-top: 22px;
    padding: 14px 18px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 4px;
    background: rgba(212, 175, 55, 0.08);
    color: var(--gold-light);
    font-size: 14px;
    font-style: italic;
    font-weight: bold;
    letter-spacing: 0.5px;
}

.reader-footer-note {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    text-align: center;
}

/* ==================== МОБИЛЬНЫЙ РЕЖИМ (<= 768px) ==================== */
@media (max-width: 768px) {
    .chronicles-wrap {
        margin: 15px 10px;
        padding: 20px 15px;
    }

    .chronicles-panel {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        gap: 14px;
    }

    .timeline-nav {
        height: auto;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 8px;
        gap: 8px;
        scroll-snap-type: x mandatory;
    }

    .timeline-btn {
        flex: 0 0 200px;
        scroll-snap-align: start;
        border-radius: 4px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--gold);
        padding: 10px 12px;
    }

    .reader-frame {
        padding: 20px 16px;
        border-radius: 4px;
    }

    .reader-title {
        font-size: 21px;
    }

    .chronicles-tab {
        padding: 10px 22px;
        font-size: 12px;
    }
}
</style>
</head>

/* ==================== РЕНДЕР И ЛОГИКА ==================== */
function showNews(index, btnElement) {
    if (btnElement) {
        document.querySelectorAll("#panelNews .timeline-btn").forEach(b => b.classList.remove("active"));
        btnElement.classList.add("active");
    }

    const data = newsDatabase[index];
    const reader = document.getElementById("newsReader");

    let paragraphsHtml = data.paragraphs.map(p => `<p>${p}</p>`).join("");
    let footerHtml = data.specialFooter ? `<div class="seal-highlight">${data.specialFooter}</div>` : "";

    reader.innerHTML = `
        <header class="reader-header">
            <span class="reader-badge-date">${data.date}</span>
            <h2 class="reader-title">${data.title}</h2>
        </header>
        <div class="reader-content">
            ${paragraphsHtml}
            ${footerHtml}
        </div>
    `;
}

function showGossip(index, btnElement) {
    if (btnElement) {
        document.querySelectorAll("#panelGossip .timeline-btn").forEach(b => b.classList.remove("active"));
        btnElement.classList.add("active");
    }

    const data = gossipDatabase[index];
    const reader = document.getElementById("gossipReader");

    let paragraphsHtml = data.paragraphs.map(p => `<p>${p}</p>`).join("");
    
    let consequencesHtml = "";
    if (data.consequences && data.consequences.length > 0) {
        let itemsHtml = data.consequences.map(c => `<p>${c}</p>`).join("");
        consequencesHtml = `
            <div class="mechanics-box">
                <div class="mechanics-title">Игровые последствия:</div>
                ${itemsHtml}
            </div>
        `;
    }

    let footerHtml = data.specialFooter ? `<div class="seal-highlight">${data.specialFooter}</div>` : "";

    reader.innerHTML = `
        <header class="reader-header">
            <span class="reader-badge-date">${data.date}</span>
            <h2 class="reader-title">${data.title}</h2>
        </header>
        <div class="reader-content">
            ${paragraphsHtml}
            ${consequencesHtml}
            ${footerHtml}
            <div class="reader-footer-note">Сплетни редко говорят всю правду. Но почти никогда не возникают на пустом месте.</div>
        </div>
    `;
}

function switchSection(type) {
    const tabNews = document.getElementById("tabBtnNews");
    const tabGossip = document.getElementById("tabBtnGossip");
    const panelNews = document.getElementById("panelNews");
    const panelGossip = document.getElementById("panelGossip");

    if (type === 'news') {
        tabNews.classList.add("active");
        tabGossip.classList.remove("active");
        panelNews.classList.add("active");
        panelGossip.classList.remove("active");
    } else {
        tabGossip.classList.add("active");
        tabNews.classList.remove("active");
        panelGossip.classList.add("active");
        panelNews.classList.remove("active");
    }
}

// Инициализация при загрузке
document.addEventListener("DOMContentLoaded", () => {
    showNews(0);
    showGossip(0);
});
